<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#0f172a;--card:#1e293b;--border:#334155;--text:#f1f5f9;--text2:#94a3b8;--text3:#64748b;--green:#10b981;--red:#ef4444;--blue:#3b82f6;--green-bg:#064e3b;--red-bg:#7f1d1d}
html,body{background:var(--bg);color:var(--text);font-family:'SF Pro Display','SF Pro',system-ui,-apple-system,sans-serif;min-height:100vh;overflow-x:hidden}
body{max-width:480px;margin:0 auto;padding-bottom:80px;padding-top:env(safe-area-inset-top,44px)}
button{font-family:inherit;cursor:pointer}
input,select{font-family:inherit}

/* Toast */
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);padding:10px 20px;border-radius:12px;font-size:13px;font-weight:600;z-index:3000;opacity:0;transition:opacity .3s;pointer-events:none;box-shadow:0 8px 32px rgba(0,0,0,.5)}
.toast.show{opacity:1}
.toast.ok{background:#065f46;color:#f1f5f9}
.toast.err{background:#7f1d1d;color:#fca5a5}

/* Overlay */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:1000;display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(4px)}
.overlay.open{display:flex}
.modal{background:var(--card);border-radius:20px 20px 0 0;width:100%;max-width:480px;padding:24px;max-height:85vh;overflow-y:auto}
.modal.income-modal{border-top:3px solid var(--green)}
.modal.expense-modal{border-top:3px solid var(--red)}

/* Inputs */
.field{margin-bottom:16px}
.field label{display:block;font-size:12px;color:var(--text2);font-weight:600;margin-bottom:6px}
.field input,.field select{width:100%;padding:12px 16px;background:var(--bg);border:1.5px solid var(--border);border-radius:12px;color:var(--text);font-size:14px;outline:none}
.field input:focus,.field select:focus{border-color:var(--blue)}
.amount-input{font-size:22px!important;font-weight:700!important}

/* Category grid */
.cat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cat-btn{padding:10px 6px;background:var(--bg);border:1.5px solid var(--border);border-radius:10px;text-align:center;transition:all .15s}
.cat-btn.sel{border-color:var(--blue);background:rgba(59,130,246,.1)}
.cat-btn .ico{font-size:18px;margin-bottom:2px}
.cat-btn .nm{font-size:10px;color:var(--text2);font-weight:600}
.cat-btn.sel .nm{color:var(--text)}

/* Submit btn */
.submit-btn{width:100%;padding:16px;border:none;border-radius:14px;font-size:16px;font-weight:700;color:#fff;transition:opacity .15s}
.submit-btn:disabled{opacity:.4;cursor:not-allowed}
.submit-btn.inc{background:linear-gradient(135deg,#10b981,#059669)}
.submit-btn.exp{background:linear-gradient(135deg,#ef4444,#dc2626)}

/* Cards */
.card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:10px}

/* Nav */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--card);border-top:1px solid var(--border);display:flex;z-index:900;padding:8px 0 max(env(safe-area-inset-bottom),8px)}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;background:none;border:none;color:var(--text3);font-size:10px;transition:color .15s}
.nav button.act{color:var(--blue);font-weight:700}
.nav button svg{width:20px;height:20px}

/* Header btns */
.hdr-btn{width:42px;height:42px;border-radius:50%;border:none;color:#fff;display:flex;align-items:center;justify-content:center}
.hdr-btn.inc{background:linear-gradient(135deg,#10b981,#059669);box-shadow:0 4px 16px rgba(16,185,129,.3)}
.hdr-btn.exp{background:linear-gradient(135deg,#ef4444,#dc2626);box-shadow:0 4px 16px rgba(239,68,68,.3)}

/* Tx list */
.tx-item{background:var(--card);border-radius:14px;padding:14px 16px;display:flex;align-items:center;gap:12px;margin-bottom:6px}
.tx-item.inc-item{border-left:3px solid var(--green)}
.tx-item.exp-item{border-left:3px solid var(--red)}
.tx-ico{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.tx-actions button{background:none;border:none;color:var(--text3);padding:4px;display:block}

/* Bars */
.pbar{height:6px;background:var(--bg);border-radius:4px;overflow:hidden;margin-top:4px}
.pbar-fill{height:100%;border-radius:4px;transition:width .5s ease}

/* Empty state */
.empty{text-align:center;padding:48px 20px;color:var(--text3)}
.empty .big{font-size:40px;margin-bottom:12px}

/* Confirm */
.confirm-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:1100;display:none;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.confirm-overlay.open{display:flex}
.confirm-box{background:var(--card);border-radius:16px;padding:24px;max-width:340px;width:90%}
.confirm-box p{color:var(--text);font-size:15px;margin-bottom:20px;line-height:1.5}
.confirm-btns{display:flex;gap:12px}
.confirm-btns button{flex:1;padding:12px;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer}
.btn-cancel{background:var(--border);color:var(--text)}
.btn-delete{background:var(--red);color:#fff}

/* Month nav */
.month-nav{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:20px}
.month-nav button{background:none;border:none;color:var(--text2);padding:8px;font-size:22px}
.month-label{font-size:15px;font-weight:700;color:#e2e8f0;text-transform:capitalize;min-width:170px;text-align:center}
</style>
</head>
<body>

<!-- Toast -->
<div id="toast" class="toast"></div>

<!-- Transaction Modal -->
<div id="txModal" class="overlay">
  <div id="txModalInner" class="modal">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
      <h3 id="modalTitle" style="font-size:17px;font-weight:700"></h3>
      <button onclick="closeModal()" style="background:none;border:none;color:var(--text2);font-size:24px">✕</button>
    </div>
    <div class="field">
      <label>Monto (Gs.)</label>
      <input type="number" id="txAmount" class="amount-input" placeholder="0" inputmode="numeric">
    </div>
    <div class="field">
      <label>Categoría</label>
      <div id="catGrid" class="cat-grid"></div>
    </div>
    <div class="field">
      <label>Descripción (opcional)</label>
      <input type="text" id="txDesc" placeholder="Ej: Alquiler marzo">
    </div>
    <div class="field">
      <label>Fecha</label>
      <input type="date" id="txDate">
    </div>
    <button id="txSubmit" class="submit-btn" onclick="saveTx()" disabled>Guardar</button>
  </div>
</div>

<!-- Confirm Delete -->
<div id="confirmOverlay" class="confirm-overlay">
  <div class="confirm-box">
    <p>¿Eliminar esta transacción? No se puede deshacer.</p>
    <div class="confirm-btns">
      <button class="btn-cancel" onclick="closeConfirm()">Cancelar</button>
      <button class="btn-delete" onclick="confirmDeleteTx()">Eliminar</button>
    </div>
  </div>
</div>

<!-- App -->
<div id="app"></div>

<!-- Nav -->
<div class="nav">
  <button id="navDash" class="act" onclick="switchTab('dashboard')">
    <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M18 20V10M12 20V4M6 20v-6"/></svg>
    Inicio
  </button>
  <button id="navTx" onclick="switchTab('transactions')">
    <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>
    Movimientos
  </button>
  <button id="navAn" onclick="switchTab('analytics')">
    <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M21 12V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2h14a2 2 0 002-2v-5zM16 12a1 1 0 100 2 1 1 0 000-2z"/></svg>
    Analytics
  </button>
</div>

<script>
// ═══════════════════════════════════════════════════
// DATA LAYER - localStorage
// ═══════════════════════════════════════════════════
const STORAGE_KEY = 'mifinanzas_v3';

function loadAll() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch(e) {}
  return { transactions: [] };
}

function saveAll(d) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(d));
    showToast('Guardado ✓');
    return true;
  } catch(e) {
    showToast('Error al guardar', true);
    return false;
  }
}

let DATA = loadAll();

// ═══════════════════════════════════════════════════
// CATEGORIES
// ═══════════════════════════════════════════════════
const CATS = {
  income: [
    {id:'salary',name:'Salario',icon:'💼',color:'#10b981'},
    {id:'airbnb',name:'Airbnb',icon:'🏠',color:'#06b6d4'},
    {id:'freelance',name:'Freelance',icon:'💻',color:'#8b5cf6'},
    {id:'investments',name:'Inversiones',icon:'📈',color:'#f59e0b'},
    {id:'other_inc',name:'Otros',icon:'💰',color:'#6366f1'},
  ],
  expense: [
    {id:'housing',name:'Vivienda',icon:'🏡',color:'#ef4444'},
    {id:'food',name:'Alimentación',icon:'🍔',color:'#f97316'},
    {id:'transport',name:'Transporte',icon:'🚗',color:'#eab308'},
    {id:'utilities',name:'Servicios',icon:'💡',color:'#84cc16'},
    {id:'entertainment',name:'Ocio',icon:'🎮',color:'#a855f7'},
    {id:'health',name:'Salud',icon:'🏥',color:'#ec4899'},
    {id:'education',name:'Educación',icon:'📚',color:'#14b8a6'},
    {id:'shopping',name:'Compras',icon:'🛒',color:'#f43f5e'},
    {id:'savings',name:'Ahorro',icon:'🏦',color:'#0ea5e9'},
    {id:'other_exp',name:'Otros',icon:'📦',color:'#64748b'},
  ]
};

function getCat(type, id) {
  const list = CATS[type] || [];
  return list.find(c => c.id === id) || {name:'?',icon:'❓',color:'#64748b'};
}

// ═══════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════
let currentTab = 'dashboard';
let monthOffset = 0;
let modalType = null; // 'income' | 'expense'
let editingId = null;
let selectedCat = '';
let deleteId = null;

// ═══════════════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════════════
function genId() { return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

function today() { return new Date().toISOString().split('T')[0]; }

function fmtGs(n) {
  const a = Math.abs(n);
  if (a >= 1e9) return (n/1e9).toFixed(1)+'B';
  if (a >= 1e6) return (n/1e6).toFixed(1)+'M';
  if (a >= 1e3) return (n/1e3).toFixed(0)+'K';
  return n.toLocaleString('es-PY');
}

function fmtFull(n) { return '₲ ' + Math.abs(n).toLocaleString('es-PY'); }

function getMonthRange(off) {
  const now = new Date();
  const d = new Date(now.getFullYear(), now.getMonth() + off, 1);
  const end = new Date(d.getFullYear(), d.getMonth() + 1, 0);
  return {
    start: d.toISOString().split('T')[0],
    end: end.toISOString().split('T')[0],
    label: d.toLocaleDateString('es-PY', {month:'long', year:'numeric'})
  };
}

function showToast(msg, isErr) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show ' + (isErr ? 'err' : 'ok');
  setTimeout(() => t.className = 'toast', 2000);
}

// ═══════════════════════════════════════════════════
// COMPUTED
// ═══════════════════════════════════════════════════
function getMonthTxs(off) {
  const r = getMonthRange(off || monthOffset);
  return DATA.transactions.filter(t => t.date >= r.start && t.date <= r.end);
}

function sumByType(txs, type) { return txs.filter(t => t.type === type).reduce((s,t) => s + t.amount, 0); }

function groupByCategory(txs, type) {
  const map = {};
  txs.filter(t => t.type === type).forEach(t => { map[t.categoryId] = (map[t.categoryId]||0) + t.amount; });
  return map;
}

// ═══════════════════════════════════════════════════
// TABS
// ═══════════════════════════════════════════════════
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.nav button').forEach(b => b.classList.remove('act'));
  document.getElementById({dashboard:'navDash',transactions:'navTx',analytics:'navAn'}[tab]).classList.add('act');
  render();
}

// ═══════════════════════════════════════════════════
// MODAL
// ═══════════════════════════════════════════════════
function openModal(type, txId) {
  modalType = type;
  editingId = txId || null;
  selectedCat = '';
  
  const m = document.getElementById('txModal');
  const inner = document.getElementById('txModalInner');
  inner.className = 'modal ' + (type === 'income' ? 'income-modal' : 'expense-modal');
  document.getElementById('modalTitle').textContent = (txId ? 'Editar ' : 'Nuevo ') + (type === 'income' ? 'Ingreso' : 'Gasto');
  
  const sub = document.getElementById('txSubmit');
  sub.className = 'submit-btn ' + (type === 'income' ? 'inc' : 'exp');
  sub.textContent = txId ? 'Actualizar' : 'Guardar';
  
  // Fill categories
  const grid = document.getElementById('catGrid');
  const cats = CATS[type];
  grid.innerHTML = cats.map(c => 
    `<button class="cat-btn" data-id="${c.id}" onclick="selectCat('${c.id}')">
      <div class="ico">${c.icon}</div>
      <div class="nm">${c.name}</div>
    </button>`
  ).join('');
  
  // Fill edit data
  if (txId) {
    const tx = DATA.transactions.find(t => t.id === txId);
    if (tx) {
      document.getElementById('txAmount').value = tx.amount;
      document.getElementById('txDesc').value = tx.description || '';
      document.getElementById('txDate').value = tx.date;
      selectedCat = tx.categoryId;
      grid.querySelectorAll('.cat-btn').forEach(b => {
        if (b.dataset.id === tx.categoryId) b.classList.add('sel');
      });
    }
  } else {
    document.getElementById('txAmount').value = '';
    document.getElementById('txDesc').value = '';
    document.getElementById('txDate').value = today();
  }
  
  validateForm();
  m.classList.add('open');
  setTimeout(() => document.getElementById('txAmount').focus(), 100);
}

function closeModal() {
  document.getElementById('txModal').classList.remove('open');
  modalType = null;
  editingId = null;
  selectedCat = '';
}

function selectCat(id) {
  selectedCat = id;
  document.querySelectorAll('#catGrid .cat-btn').forEach(b => {
    b.classList.toggle('sel', b.dataset.id === id);
  });
  validateForm();
}

function validateForm() {
  const amount = parseFloat(document.getElementById('txAmount').value);
  const date = document.getElementById('txDate').value;
  document.getElementById('txSubmit').disabled = !(amount > 0 && selectedCat && date);
}

// Listen for input changes
document.addEventListener('input', e => {
  if (e.target.id === 'txAmount' || e.target.id === 'txDate') validateForm();
});

function saveTx() {
  const amount = parseFloat(document.getElementById('txAmount').value);
  const desc = document.getElementById('txDesc').value.trim();
  const date = document.getElementById('txDate').value;
  
  if (!(amount > 0) || !selectedCat || !date) return;
  
  if (editingId) {
    const idx = DATA.transactions.findIndex(t => t.id === editingId);
    if (idx >= 0) {
      DATA.transactions[idx] = {
        ...DATA.transactions[idx],
        amount, categoryId: selectedCat, description: desc, date
      };
    }
  } else {
    DATA.transactions.push({
      id: genId(),
      type: modalType,
      amount,
      categoryId: selectedCat,
      description: desc,
      date,
      createdAt: Date.now()
    });
  }
  
  saveAll(DATA);
  closeModal();
  render();
}

// ═══════════════════════════════════════════════════
// DELETE
// ═══════════════════════════════════════════════════
function askDelete(id) {
  deleteId = id;
  document.getElementById('confirmOverlay').classList.add('open');
}

function closeConfirm() {
  deleteId = null;
  document.getElementById('confirmOverlay').classList.remove('open');
}

function confirmDeleteTx() {
  if (!deleteId) return;
  DATA.transactions = DATA.transactions.filter(t => t.id !== deleteId);
  saveAll(DATA);
  closeConfirm();
  render();
}

// ═══════════════════════════════════════════════════
// MONTH NAV
// ═══════════════════════════════════════════════════
function prevMonth() { monthOffset--; render(); }
function nextMonth() { monthOffset++; render(); }

// ═══════════════════════════════════════════════════
// SVG CHARTS
// ═══════════════════════════════════════════════════
function renderBarChart(data) {
  if (!data.length) return '';
  const maxVal = Math.max(...data.map(d => Math.max(d.inc||0, d.exp||0)), 1);
  const H = 120, barW = 16, gap = 12;
  const W = data.length * (barW*2 + gap) + 20;
  
  let bars = '';
  data.forEach((d,i) => {
    const x = 10 + i * (barW*2 + gap);
    const incH = (d.inc/maxVal) * H;
    const expH = (d.exp/maxVal) * H;
    bars += `<rect x="${x}" y="${H-incH}" width="${barW}" height="${incH}" rx="3" fill="#10b981" opacity=".85"/>`;
    bars += `<rect x="${x+barW+2}" y="${H-expH}" width="${barW}" height="${expH}" rx="3" fill="#ef4444" opacity=".85"/>`;
    bars += `<text x="${x+barW}" y="${H+16}" text-anchor="middle" font-size="9" fill="#94a3b8">${d.label}</text>`;
  });
  
  return `<svg width="${W}" height="${H+25}" style="display:block"><line x1="0" y1="${H}" x2="${W}" y2="${H}" stroke="#334155" stroke-width=".5"/>${bars}</svg>`;
}

function renderDonut(segments, size) {
  size = size || 110;
  const total = segments.reduce((s,seg) => s + seg.value, 0);
  if (!total) return '';
  const cx = size/2, cy = size/2, r = size*.38, sw = size*.14;
  let cum = -90;
  let arcs = '';
  segments.forEach(seg => {
    const angle = (seg.value/total)*360;
    const s = (cum*Math.PI)/180;
    const e = ((cum+angle)*Math.PI)/180;
    cum += angle;
    const la = angle > 180 ? 1 : 0;
    const x1 = cx+r*Math.cos(s), y1 = cy+r*Math.sin(s);
    const x2 = cx+r*Math.cos(e), y2 = cy+r*Math.sin(e);
    arcs += `<path d="M${x1},${y1} A${r},${r} 0 ${la} 1 ${x2},${y2}" fill="none" stroke="${seg.color}" stroke-width="${sw}" stroke-linecap="round"/>`;
  });
  arcs += `<text x="${cx}" y="${cy-4}" text-anchor="middle" font-size="11" font-weight="700" fill="#f1f5f9">${fmtGs(total)}</text>`;
  arcs += `<text x="${cx}" y="${cy+10}" text-anchor="middle" font-size="9" fill="#94a3b8">total</text>`;
  return `<svg width="${size}" height="${size}" style="display:block">${arcs}</svg>`;
}

function renderSankey(incByCat, expByCat) {
  const totalInc = Object.values(incByCat).reduce((s,v) => s+v, 0);
  const totalExp = Object.values(expByCat).reduce((s,v) => s+v, 0);
  if (!totalInc && !totalExp) return '<div style="text-align:center;padding:24px;color:#64748b;font-size:13px">Agregá ingresos y gastos para ver el flujo</div>';
  
  const surplus = Math.max(0, totalInc - totalExp);
  const W = 700, H = 400, nw = 12, pad = 5;
  const lx = 100, mx = W/2-nw/2, rx = W-100-nw;
  
  // Income nodes
  const incItems = CATS.income.filter(c => (incByCat[c.id]||0) > 0).map(c => ({...c, value: incByCat[c.id]}));
  const totalIH = H - 40;
  let iy = 20;
  const incNodes = incItems.map(item => {
    const h = Math.max(14, (item.value/Math.max(totalInc,1)) * totalIH);
    const node = {...item, y:iy, h};
    iy += h + pad;
    return node;
  });
  
  // Mid node
  const midH = Math.min(H-40, Math.max(50, totalIH*.6));
  const midY = (H-midH)/2;
  
  // Expense + surplus nodes
  const expItems = CATS.expense.filter(c => (expByCat[c.id]||0) > 0).map(c => ({...c, value: expByCat[c.id]}));
  if (surplus > 0) expItems.push({id:'surplus',name:'Excedente',icon:'💚',color:'#10b981',value:surplus});
  const totalR = expItems.reduce((s,i) => s+i.value, 0);
  let ey = 20;
  const expNodes = expItems.map(item => {
    const h = Math.max(14, (item.value/Math.max(totalR,1)) * totalIH);
    const node = {...item, y:ey, h};
    ey += h + pad;
    return node;
  });
  
  // Flows
  let paths = '';
  let mly = midY;
  incNodes.forEach(n => {
    const fh = (n.value/Math.max(totalInc,1)) * midH;
    const midXr = (lx+nw + mx)/2;
    paths += `<path d="M${lx+nw},${n.y} C${midXr},${n.y} ${midXr},${mly} ${mx},${mly} L${mx},${mly+fh} C${midXr},${mly+fh} ${midXr},${n.y+n.h} ${lx+nw},${n.y+n.h} Z" fill="${n.color}" opacity=".18"/>`;
    mly += fh;
  });
  
  let mry = midY;
  expNodes.forEach(n => {
    const fh = (n.value/Math.max(totalR,1)) * midH;
    const midXr = (mx+nw + rx)/2;
    paths += `<path d="M${mx+nw},${mry} C${midXr},${mry} ${midXr},${n.y} ${rx},${n.y} L${rx},${n.y+n.h} C${midXr},${n.y+n.h} ${midXr},${mry+fh} ${mx+nw},${mry+fh} Z" fill="${n.color}" opacity=".18"/>`;
    mry += fh;
  });
  
  // Nodes
  let nodes = '';
  incNodes.forEach(n => {
    nodes += `<rect x="${lx}" y="${n.y}" width="${nw}" height="${n.h}" rx="4" fill="${n.color}"/>`;
    nodes += `<text x="${lx-6}" y="${n.y+n.h/2+4}" text-anchor="end" font-size="11" fill="#cbd5e1">${n.icon} ${n.name}</text>`;
  });
  
  nodes += `<rect x="${mx}" y="${midY}" width="${nw}" height="${midH}" rx="6" fill="#3b82f6"/>`;
  nodes += `<text x="${mx+nw/2}" y="${midY-8}" text-anchor="middle" font-size="12" font-weight="600" fill="#93c5fd">Cash Flow</text>`;
  
  expNodes.forEach(n => {
    nodes += `<rect x="${rx}" y="${n.y}" width="${nw}" height="${n.h}" rx="4" fill="${n.color}"/>`;
    nodes += `<text x="${rx+nw+6}" y="${n.y+n.h/2+4}" text-anchor="start" font-size="11" fill="#cbd5e1">${n.icon} ${n.name}</text>`;
  });
  
  return `<div style="width:100%;overflow-x:auto"><svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="display:block;max-width:100%">${paths}${nodes}</svg></div>`;
}

// ═══════════════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════════════
function render() {
  const app = document.getElementById('app');
  const range = getMonthRange(monthOffset);
  const txs = getMonthTxs();
  const inc = sumByType(txs, 'income');
  const exp = sumByType(txs, 'expense');
  const bal = inc - exp;
  const rate = inc > 0 ? ((bal/inc)*100).toFixed(0) : 0;
  const incByCat = groupByCategory(txs, 'income');
  const expByCat = groupByCategory(txs, 'expense');
  
  let html = '';
  
  // ─── HEADER ───
  html += `
  <div style="padding:20px 20px 0">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <div>
        <div style="font-size:11px;color:#64748b;font-weight:700;letter-spacing:1.5px;text-transform:uppercase">MiFinanzas</div>
        <div style="font-size:20px;font-weight:800;margin-top:2px">Hola, Mauri 👋</div>
      </div>
      <div style="display:flex;gap:8px">
        <button class="hdr-btn inc" onclick="openModal('income')">
          <svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
        </button>
        <button class="hdr-btn exp" onclick="openModal('expense')">
          <svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14"/></svg>
        </button>
      </div>
    </div>
    <div class="month-nav">
      <button onclick="prevMonth()">‹</button>
      <div class="month-label">${range.label}</div>
      <button onclick="nextMonth()">›</button>
    </div>
  </div>
  <div style="padding:0 16px">`;
  
  // ─── DASHBOARD ───
  if (currentTab === 'dashboard') {
    // Summary
    html += `
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px">
      <div class="card" style="border:1px solid #1e3a2f">
        <div style="font-size:11px;color:#6ee7b7;font-weight:600;margin-bottom:4px">Ingresos</div>
        <div style="font-size:20px;font-weight:800;color:#10b981">${fmtFull(inc)}</div>
      </div>
      <div class="card" style="border:1px solid #3b1c1c">
        <div style="font-size:11px;color:#fca5a5;font-weight:600;margin-bottom:4px">Gastos</div>
        <div style="font-size:20px;font-weight:800;color:#ef4444">${fmtFull(exp)}</div>
      </div>
    </div>`;
    
    // Balance
    const balBg = bal >= 0 ? 'linear-gradient(135deg,#064e3b,#065f46)' : 'linear-gradient(135deg,#7f1d1d,#991b1b)';
    html += `
    <div class="card" style="background:${balBg};text-align:center;padding:18px">
      <div style="font-size:11px;color:rgba(255,255,255,.7);font-weight:600;margin-bottom:4px">Balance del mes</div>
      <div style="font-size:26px;font-weight:900;color:#fff">${bal>=0?'+':'-'} ${fmtFull(bal)}</div>
      <div style="font-size:12px;color:rgba(255,255,255,.6);margin-top:6px">Tasa de ahorro: ${rate}%</div>
    </div>`;
    
    // Bar chart
    const chartData = [];
    for (let i = -5; i <= 0; i++) {
      const r = getMonthRange(monthOffset + i);
      const mt = DATA.transactions.filter(t => t.date >= r.start && t.date <= r.end);
      const d = new Date(r.start + 'T12:00:00');
      chartData.push({
        label: d.toLocaleDateString('es-PY',{month:'short'}),
        inc: sumByType(mt,'income'),
        exp: sumByType(mt,'expense')
      });
    }
    html += `
    <div class="card">
      <div style="font-size:13px;font-weight:700;margin-bottom:12px">Últimos 6 meses</div>
      <div style="display:flex;gap:12px;margin-bottom:8px">
        <div style="display:flex;align-items:center;gap:4px"><div style="width:10px;height:10px;border-radius:2px;background:#10b981"></div><span style="font-size:10px;color:#94a3b8">Ingresos</span></div>
        <div style="display:flex;align-items:center;gap:4px"><div style="width:10px;height:10px;border-radius:2px;background:#ef4444"></div><span style="font-size:10px;color:#94a3b8">Gastos</span></div>
      </div>
      <div style="overflow-x:auto">${renderBarChart(chartData)}</div>
    </div>`;
    
    // Donuts
    const incSegs = CATS.income.filter(c => incByCat[c.id]).map(c => ({value:incByCat[c.id],color:c.color}));
    const expSegs = CATS.expense.filter(c => expByCat[c.id]).map(c => ({value:expByCat[c.id],color:c.color}));
    
    html += `<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">`;
    
    // Income donut
    html += `<div class="card">
      <div style="font-size:12px;font-weight:700;color:#6ee7b7;margin-bottom:10px">Ingresos</div>
      <div style="display:flex;justify-content:center">${renderDonut(incSegs)}</div>
      <div style="margin-top:10px">`;
    CATS.income.filter(c => incByCat[c.id]).sort((a,b) => (incByCat[b.id]||0)-(incByCat[a.id]||0)).forEach(c => {
      html += `<div style="display:flex;justify-content:space-between;padding:3px 0"><span style="font-size:10px;color:#94a3b8">${c.icon} ${c.name}</span><span style="font-size:10px;font-weight:600;color:#e2e8f0">${fmtGs(incByCat[c.id])}</span></div>`;
    });
    html += `</div></div>`;
    
    // Expense donut
    html += `<div class="card">
      <div style="font-size:12px;font-weight:700;color:#fca5a5;margin-bottom:10px">Gastos</div>
      <div style="display:flex;justify-content:center">${renderDonut(expSegs)}</div>
      <div style="margin-top:10px">`;
    CATS.expense.filter(c => expByCat[c.id]).sort((a,b) => (expByCat[b.id]||0)-(expByCat[a.id]||0)).forEach(c => {
      html += `<div style="display:flex;justify-content:space-between;padding:3px 0"><span style="font-size:10px;color:#94a3b8">${c.icon} ${c.name}</span><span style="font-size:10px;font-weight:600;color:#e2e8f0">${fmtGs(expByCat[c.id])}</span></div>`;
    });
    html += `</div></div></div>`;
    
    // Sankey
    html += `<div class="card">
      <div style="font-size:13px;font-weight:700;margin-bottom:8px">Flujo de dinero</div>
      ${renderSankey(incByCat, expByCat)}
    </div>`;
  }
  
  // ─── TRANSACTIONS ───
  if (currentTab === 'transactions') {
    html += `<div style="font-size:17px;font-weight:800;margin-bottom:16px">Transacciones</div>`;
    
    if (!txs.length) {
      html += `<div class="empty"><div class="big">📋</div><div style="font-size:14px;font-weight:600">Sin transacciones este mes</div><div style="font-size:12px;margin-top:6px">Usá los botones + y - para agregar</div></div>`;
    } else {
      const sorted = [...txs].sort((a,b) => b.date.localeCompare(a.date) || b.createdAt - a.createdAt);
      sorted.forEach(tx => {
        const cat = getCat(tx.type, tx.categoryId);
        const isInc = tx.type === 'income';
        const dateStr = new Date(tx.date+'T12:00:00').toLocaleDateString('es-PY',{day:'numeric',month:'short'});
        html += `
        <div class="tx-item ${isInc?'inc-item':'exp-item'}">
          <div class="tx-ico" style="background:${cat.color}22">${cat.icon}</div>
          <div style="flex:1;min-width:0">
            <div style="font-size:13px;font-weight:700">${cat.name}</div>
            ${tx.description ? `<div style="font-size:11px;color:#64748b;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${tx.description}</div>` : ''}
            <div style="font-size:10px;color:#475569;margin-top:2px">${dateStr}</div>
          </div>
          <div style="text-align:right;flex-shrink:0">
            <div style="font-size:14px;font-weight:800;color:${isInc?'#10b981':'#ef4444'}">${isInc?'+':'-'}${fmtGs(tx.amount)}</div>
          </div>
          <div class="tx-actions">
            <button onclick="openModal('${tx.type}','${tx.id}')"><svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button>
            <button onclick="askDelete('${tx.id}')"><svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/></svg></button>
          </div>
        </div>`;
      });
    }
  }
  
  // ─── ANALYTICS ───
  if (currentTab === 'analytics') {
    html += `<div style="font-size:17px;font-weight:800;margin-bottom:16px">Analytics</div>`;
    
    // Top expenses
    html += `<div class="card"><div style="font-size:13px;font-weight:700;color:#fca5a5;margin-bottom:12px">Top gastos del mes</div>`;
    const topExp = CATS.expense.filter(c => expByCat[c.id]).sort((a,b) => (expByCat[b.id]||0)-(expByCat[a.id]||0)).slice(0,5);
    if (!topExp.length) {
      html += `<div style="text-align:center;padding:20px;color:#64748b;font-size:13px">Sin gastos registrados</div>`;
    } else {
      topExp.forEach(c => {
        const v = expByCat[c.id]||0;
        const pct = exp > 0 ? (v/exp)*100 : 0;
        html += `<div style="margin-bottom:12px">
          <div style="display:flex;justify-content:space-between;margin-bottom:4px">
            <span style="font-size:12px">${c.icon} ${c.name}</span>
            <span style="font-size:12px;font-weight:700">${fmtFull(v)} (${pct.toFixed(0)}%)</span>
          </div>
          <div class="pbar"><div class="pbar-fill" style="width:${pct}%;background:${c.color}"></div></div>
        </div>`;
      });
    }
    html += `</div>`;
    
    // Income sources
    html += `<div class="card"><div style="font-size:13px;font-weight:700;color:#6ee7b7;margin-bottom:12px">Fuentes de ingreso</div>`;
    const topInc = CATS.income.filter(c => incByCat[c.id]).sort((a,b) => (incByCat[b.id]||0)-(incByCat[a.id]||0));
    if (!topInc.length) {
      html += `<div style="text-align:center;padding:20px;color:#64748b;font-size:13px">Sin ingresos registrados</div>`;
    } else {
      topInc.forEach(c => {
        const v = incByCat[c.id]||0;
        const pct = inc > 0 ? (v/inc)*100 : 0;
        html += `<div style="margin-bottom:12px">
          <div style="display:flex;justify-content:space-between;margin-bottom:4px">
            <span style="font-size:12px">${c.icon} ${c.name}</span>
            <span style="font-size:12px;font-weight:700">${fmtFull(v)} (${pct.toFixed(0)}%)</span>
          </div>
          <div class="pbar"><div class="pbar-fill" style="width:${pct}%;background:${c.color}"></div></div>
        </div>`;
      });
    }
    html += `</div>`;
    
    // Monthly summary
    const expCount = txs.filter(t => t.type==='expense').length;
    html += `<div class="card"><div style="font-size:13px;font-weight:700;margin-bottom:12px">Resumen mensual</div>`;
    [
      ['Total transacciones', txs.length],
      ['Ingresos', txs.filter(t=>t.type==='income').length],
      ['Gastos', expCount],
      ['Promedio por gasto', expCount > 0 ? fmtFull(exp/expCount) : '₲ 0'],
      ['Gasto diario promedio', fmtFull(exp/30)],
    ].forEach(([label,val],i) => {
      html += `<div style="display:flex;justify-content:space-between;padding:8px 0;${i<4?'border-bottom:1px solid #334155':''}">
        <span style="font-size:12px;color:#94a3b8">${label}</span>
        <span style="font-size:12px;font-weight:700">${val}</span>
      </div>`;
    });
    html += `</div>`;
    
    // Historical totals
    const allInc = DATA.transactions.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0);
    const allExp = DATA.transactions.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0);
    const allBal = allInc - allExp;
    html += `<div class="card"><div style="font-size:13px;font-weight:700;margin-bottom:12px">Totales históricos</div>`;
    [
      ['Ingreso total', fmtFull(allInc), '#10b981'],
      ['Gasto total', fmtFull(allExp), '#ef4444'],
      ['Balance total', (allBal>=0?'+ ':'- ')+fmtFull(allBal), allBal>=0?'#10b981':'#ef4444'],
      ['Total transacciones', DATA.transactions.length, '#f1f5f9'],
    ].forEach(([label,val,col],i) => {
      html += `<div style="display:flex;justify-content:space-between;padding:8px 0;${i<3?'border-bottom:1px solid #334155':''}">
        <span style="font-size:12px;color:#94a3b8">${label}</span>
        <span style="font-size:12px;font-weight:700;color:${col}">${val}</span>
      </div>`;
    });
    html += `</div>`;
    
    // Danger zone
    html += `<div class="card" style="border:1px solid #7f1d1d">
      <div style="font-size:13px;font-weight:700;color:#fca5a5;margin-bottom:8px">Zona de peligro</div>
      <button onclick="resetAll()" style="width:100%;padding:10px 16px;background:#7f1d1d;color:#fca5a5;border:1px solid #991b1b;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer">Eliminar todos los datos</button>
    </div>`;
  }
  
  html += `</div>`;
  app.innerHTML = html;
}

function resetAll() {
  if (confirm('¿Eliminar TODOS los datos? Esto no se puede deshacer.')) {
    DATA = { transactions: [] };
    saveAll(DATA);
    render();
  }
}

// ═══════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════
render();
</script>
</body>
</html>
